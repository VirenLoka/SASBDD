defaults: [base.yaml]

# =============================================================================
# Stage 2 -- SA-guided finetuning of DiffSBDD.
#
# Per optimiser step:
#   1. DDPM loss on real data at t ~ U[0, T]                (unchanged)
#   2. reward pass at t ~ U[reward.t_min, reward.t_max]
#      -> Tweedie x0_hat -> box-integral -> Gumbel-ST -> frozen surrogate
#   3. anchor ||eps_theta - eps_frozen||^2 at the reward pass's own z_t
#   4. SEPARATE backwards for reward and anchor, each budgeted against the DDPM
#      gradient independently, then summed, clipped, stepped
#
# Architecture hyperparameters are read from `base_checkpoint`, so they cannot
# drift out of sync with the weights being finetuned.  Anything set under
# `diffsbdd:` here overrides what the checkpoint says.
#
# -----------------------------------------------------------------------------
# CHANGES FROM THE 50-EPOCH RUN THAT PRODUCED A NULL RESULT
# -----------------------------------------------------------------------------
# That run was mechanically perfect (budget pinned at exactly 0.200000 on all
# 3116 logged steps, anchor 7.1e-04 at init, reward_t = 37.5) and moved nothing:
# sa_true 4.614 -> 4.462 (1.27 SE, i.e. noise), sa_pred 2.266 -> 2.335 (worse).
# The optimised objective itself (`sa/reward_term`) improved 2.295 -> 2.240
# (r = -0.709) -- a real but tiny trend that did not transfer to samples.
#
#   t_min 0 -> 25, t_max 75 -> 200   THE MAIN CHANGE.  At t in [0,75] of T=500,
#     r(t) = sigma/alpha spans only 0.022 -> 0.217, so z_t is a barely perturbed
#     REAL ligand and Tweedie's x0_hat reconstructs it almost exactly.  The
#     gradient therefore said "denoise a near-clean real molecule toward lower
#     SA" -- a reconstruction-perturbation task with almost no leverage on the
#     generative distribution, which is set at moderate-to-high t.  That is why
#     reward_term improved while sa_pred on sampled molecules did not.
#   type_weight 1.0 -> 0.05          Types are near-uniform past t ~ 75, so
#     above that only coordinates carry signal.  Stage 1's own note: "if you
#     weight coordinates far above types you can raise t_max."  This is that.
#   deterministic false -> true      With type gradients downweighted there is
#     nothing left that needs the Gumbel sample; argmax cuts reward variance.
#   grad_budget 0.2 -> 0.3           It now budgets the REWARD ALONE.  Previously
#     reward and anchor shared one allowance, so the anchor (which grew 16x over
#     the run) crowded the reward out and throttled its own restoring force.
#   grad_clip_ceiling 1000 -> 0.35   Measured median grad_total was 0.071, so the
#     old ceiling was ~14000x typical and the ratchet backstop was absent.
#   eval_sa_epochs 5 -> 2, samples 100 -> 200   sa_true's SE was 0.119 against a
#     cross-eval spread of 0.121 -- the run could not have detected its own
#     effect.  200 samples halves the SE; 25 evals instead of 10 gives a trend.
# =============================================================================

run_name: sa-guided-cond-full-v2

# Pretrained DiffSBDD checkpoint to finetune (required).
base_checkpoint: checkpoints/crossdocked_fullatom_cond.ckpt

data:
  source: targetdiff_lmdb
  lmdb_path: data/crossdocked_v1.1_rmsd1.0_pocket10_processed_final.lmdb
  split_path: data/crossdocked_pocket10_pose_split.pt
  raw_dir: null             # null -> paths.crossdocked_raw (only for docking eval)

  # The LMDB stores 10 A pockets; the pretrained checkpoint was trained on 8 A.
  pocket_cutoff: 8.0
  center: true

  # The pose split has train/test only; a validation set is carved out of train
  # by index, with no overlap.
  val_size: 300
  split_seed: 0

  max_ligand_atoms: null    # null -> no cap
  field_map: {}             # override auto-detected field names if a fork renames them
  docking_eval: false       # smina scoring during eval; needs smina + receptor PDBs

diffsbdd:
  datadir: null             # null -> paths.processed_crossdock (npz source only)
  batch_size: 32
  lr: 1.0e-5                # finetuning; pretraining used 1e-3
  num_workers: 0
  clip_grad: true
  auxiliary_loss: false     # the LJ aux term; independent of the SA reward
  eval_epochs: 5
  visualize_sample_epoch: 1000000     # visualisation off during finetuning
  visualize_chain_epoch: 1000000
  eval_params:
    n_eval_samples: 100
    eval_batch_size: 32
    # Uniqueness now works with this null (the guard bug in
    # analysis/metrics.py:compute_uniqueness is fixed); Novelty reports NaN
    # until you point this at a .npy of training SMILES.
    smiles_file: null
    n_visualize_samples: 0
    keep_frames: 0

surrogate:
  checkpoint: sa_surrogate/checkpoints/sa_crossdock_gat/best.pt
  # Measured by stage2/calibrate.py on real data -- do not revert to 0.3.
  residual_scale: 0.631
  residual_scale_types: 0.111
  tau: null                 # null -> the tau the surrogate was trained with
  hard: true                # straight-through: hard forward, soft backward
  deterministic: true       # argmax instead of Gumbel: lower reward variance
  strict_validation: true   # fail loudly on vocab / schedule mismatch

reward:
  # NOTE: with the reward on its own budget, `weight` cancels exactly whenever
  # the budget binds (scale = rho*||g_ddpm||/||g_rew||, and ||g_rew|| ~ weight).
  # It bound on 100% of steps last run.  `grad_budget` is the real strength knob
  # -- tune that, leave this alone.
  weight: 0.01
  warmup_steps: 500         # ramps rho, not weight (see reward_ramp_now())
  start_step: 0
  # Reward timestep band.  See the header: the old [0,75] had no generative
  # leverage.  Coordinates carry signal to t ~ 150-200; the surrogate's input
  # gradient self-anneals above that because it falls back to the marginal.
  t_min: 25
  t_max: 200
  # Cap the REWARD gradient at this fraction of the DDPM gradient norm.
  grad_budget: 0.3
  # 5x the measured median grad_total (0.071).  Kills the ratchet.
  grad_clip_ceiling: 0.35
  # Equalise the coord/type blocks, then apply the weights as a ratio.  Types
  # are noise over most of the new [25,200] band, hence 20:1 toward coordinates.
  channel_balance: normalize
  coord_weight: 1.0
  type_weight: 0.05
  # The reward-hacking detector.  Also the ONLY readout of whether this run
  # worked, so it needs enough samples to resolve its own effect.
  eval_sa_epochs: 2
  eval_sa_samples: 200

anchor:
  enabled: true
  weight: 1.0
  # NEW -- and DO NOT set this to null.  null means "unscaled", and the measured
  # norms from the last run (||g_anchor|| = 8.46 vs ||g_ddpm|| = 0.071) put an
  # unscaled anchor at 119x the DDPM gradient, which would freeze the model
  # outright.  0.2 reproduces roughly the restoring force the anchor actually
  # had last run (it shared the 0.2 allowance with the reward, taking the larger
  # share of it) -- and that was demonstrably plenty: the anchor loss reached
  # only 0.0115, sa_gap never widened, validity held at 0.97-1.00.  The point of
  # splitting the budgets is to stop the anchor stealing from the reward, not to
  # make the anchor stronger.
  grad_budget: 0.2

trainer:
  max_epochs: 50
  accelerator: auto         # auto | cpu | gpu
  devices: 1
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  enable_progress_bar: true
  save_top_k: 3
  # NEW.  `loss/val` is a variance-dominated NLL estimate (std 11.9, range
  # -29..+29, no trend), so the last run's three "best" checkpoints were epochs
  # 19/16/18 -- the three luckiest draws.  error_t_lig/val has std 0.88.
  monitor: error_t_lig/val
  # NEW.  sa_true is only computed every reward.eval_sa_epochs, so post-hoc
  # selection on it needs snapshots that `monitor` did not choose.
  save_every_n_epochs: 5
  val_check_interval: 1.0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
